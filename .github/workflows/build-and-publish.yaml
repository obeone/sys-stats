name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest version the package claims to support, the one the Dockerfile
        # uses, and the newest stable one.
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package with its dev extra
        run: python -m pip install -e '.[dev]'

      - name: Lint
        # The linter is version independent, so run it once instead of 3 times.
        if: matrix.python-version == '3.12'
        run: ruff check .

      - name: Run the test suite
        run: pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # For cosign

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pinned to an exact release: setup-uv publishes no moving major tag.
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      # pyproject.toml is the single source of truth for the version: it feeds
      # both the image tags and the OCI version label, so neither the Dockerfile
      # nor this file ever spells a version out. `uv version` reports the project
      # version because it runs at the repo root; uv's own is `uv self version`.
      - name: Read the package version
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      # A release tag names a version, so it has to be the version the tree
      # actually carries. Without this, tagging v1.4.0 on a 1.3.0 checkout would
      # cheerfully publish an image whose tag lies about its contents.
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          expected="v${{ steps.version.outputs.version }}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml ($expected)."
            exit 1
          fi

      # Version tags are immutable by contract: only a release tag publishes
      # :X.Y.Z, and :latest moves with it. Every other commit on main lands on
      # :edge, alongside a :sha- tag that stays pinned to that single build.
      - name: Resolve the image tags
        id: tags
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            names="latest ${{ steps.version.outputs.version }}"
          else
            names="edge sha-${GITHUB_SHA:0:7}"
          fi
          {
            echo 'list<<TAGS'
            for name in $names; do
              echo "ghcr.io/obeone/sys-stats:$name"
              echo "docker.io/obeoneorg/sys-stats:$name"
            done
            echo TAGS
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gated exactly like the build step below: a workflow_dispatch run builds
      # without publishing, so it has nothing to authenticate for.
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        id: docker_build
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.tags.outputs.list }}
          platforms: linux/amd64,linux/arm64

      - name: Set up cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Sign the container image with cosign
        if: github.event_name == 'push'
        run: |
          cosign sign --yes ghcr.io/obeone/sys-stats@${DIGEST}
          cosign sign --yes docker.io/obeoneorg/sys-stats@${DIGEST}
        env:
          COSIGN_EXPERIMENTAL: true
          DIGEST: ${{ steps.docker_build.outputs.digest }}

      # The description mirrors the README, which lives on main.
      - name: Update Docker Hub description
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: obeoneorg/sys-stats
