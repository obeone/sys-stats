[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sys-stats"
# No version here on purpose: git tags are the single source of truth, and
# hatch-vcs reads the current one (see [tool.hatch.version] below). A build on
# the v1.6.0 tag is 1.6.0; three commits later it is 1.6.1.dev3+g<sha>, which is
# exactly what an :edge image should call itself. A build with no repository to
# read (the Docker image, an unpacked sdist) gets the version handed to it
# through SETUPTOOLS_SCM_PRETEND_VERSION instead.
dynamic = ["version"]
description = "Real-time system, GPU and Ollama monitoring dashboard (terminal + web)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "obeone", email = "obeone@obeone.org" }]
keywords = ["monitoring", "dashboard", "gpu", "nvidia", "ollama", "psutil", "rich"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "coloredlogs>=15.0.1",
    "Flask>=3.1.3",
    "Flask-Cors>=6.0.5",
    "GPUtil>=1.4",
    "psutil>=7.2.2",
    "requests>=2.34.2",
    "rich>=15.0",
    "readchar>=4.2.2",
    "setuptools>=83.0; python_version >= '3.12'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[project.urls]
Homepage = "https://github.com/obeone/sys-stats"
Repository = "https://github.com/obeone/sys-stats"
Issues = "https://github.com/obeone/sys-stats/issues"

[project.scripts]
sys-stats = "sys_stats.cli:main"
sys-stats-server = "sys_stats.server:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/sys_stats"]

[tool.hatch.build.targets.sdist]
include = ["src/sys_stats", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
