---
# sys-stats reports on the node it runs on, not on the cluster. Every place
# this chart deviates from the usual hardening defaults, it is for that
# reason, and the comment below it says which.

global:
  # The pod never calls the Kubernetes API, so the unprivileged ServiceAccount
  # the library creates by default would only be dead weight.
  createDefaultServiceAccount: false

defaultPodOptions:
  automountServiceAccountToken: false

  # Without the host PID namespace the process panels list exactly one
  # process, the server's own. This is the single setting that makes the
  # "top processes" and "GPU processes" tables mean anything.
  hostPID: true

  # A dashboard about "the node" is only useful if it keeps landing on the
  # same node. Pin it to the machine you actually want to watch.
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Some clusters expose NVIDIA devices through a RuntimeClass rather than
  # the default runtime. Set it here when that is the case.
  # runtimeClassName: nvidia

controllers:
  main:
    type: deployment
    replicas: 1
    strategy: Recreate

    containers:
      main:
        image:
          repository: ghcr.io/obeone/sys-stats
          # Rendered through tpl, so the chart's appVersion stays the only
          # place the deployed version is spelled out.
          tag: "{{ .Chart.AppVersion }}"
          pullPolicy: IfNotPresent

        env:
          TZ: UTC
          # Point this at an Ollama instance to fill the Ollama panel. Left
          # unset, the server answers with an empty model list rather than an
          # error, and the panel simply stays empty.
          # OLLAMA_API_URL: http://ollama.ollama.svc.cluster.local:11434

          # Seconds the background sampler waits between samples. Defaults
          # to 2.0; raising it lowers CPU/nvidia-smi overhead at the cost of
          # staler panels.
          # SYS_STATS_SAMPLE_INTERVAL: "2.0"

          # Cap on how many entries the sampler collects per per-process
          # ranking (top CPU, top memory, top GPU). Defaults to 50; a
          # dashboard ?limit= above this only returns what was sampled.
          # SYS_STATS_TOP_PROCESSES_MAX: "50"

          # Skips the module-scope sampler autostart when set to "0",
          # "false" or "no". Defaults to on; a normal deployment never
          # needs this.
          # SYS_STATS_AUTOSTART: "0"

          # Caps on the /panel route's temps/fans/gpu lists, for a small
          # embedded display with limited room (an ESP32-S3 wall panel, in
          # particular). Each unset by default, meaning no cap.
          # SYS_STATS_PANEL_MAX_TEMPS: "4"
          # SYS_STATS_PANEL_MAX_FANS: "4"
          # SYS_STATS_PANEL_MAX_GPUS: "2"

          # Security-relevant: "1"/"true"/"yes" registers ONLY /panel --
          # /, /stats and /favicon.png are never registered at all, not just
          # guarded, so /stats' unauthenticated full process table (complete
          # command lines included) can never be reached on a host whose
          # network is not fully trusted. Default is off (every route
          # registered). Enabling this ALSO breaks the liveness/readiness/
          # startup probes below, which hit "/" by default -- repoint them
          # at "/panel" if you turn this on.
          # SYS_STATS_PANEL_ONLY: "1"

          # Overrides the /panel payload's "host" identity field, which is
          # socket.gethostname() by default (the pod's own hostname, not the
          # node it landed on). Set this where that value is meaningless to
          # a consumer comparing it against a known machine name. Unrelated
          # to SYS_STATS_INSTANCE_LABEL (README.md): that one is a
          # human-facing display label, this one is a machine identity, and
          # the two are never derived from one another.
          # SYS_STATS_HOSTNAME: "bart.virt.obeone.org"

          # Points /panel's gpu[] at a dcgm-exporter Prometheus /metrics
          # endpoint instead of GPUtil/nvidia-smi -- for a host with no
          # NVIDIA driver of its own (GPUs passed through to a VM running
          # dcgm-exporter elsewhere in the cluster). Expected to carry a
          # literal IP, not a hostname (requests' timeout does not bound DNS
          # resolution). /stats always stays on the GPUtil/nvidia-smi path;
          # unset (default) leaves /panel on it too.
          # SYS_STATS_DCGM_URL: "http://10.50.0.106:30940/metrics"

        securityContext:
          # nvidia-smi and the host's /proc both need more than the image's
          # unprivileged user gets by default. Dropping this is worth trying
          # on a CPU-only node: the CPU, RAM and process panels survive it,
          # the GPU ones generally do not.
          privileged: true

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
            # Claim a GPU so nvidia-smi has something to report on. Requires
            # the NVIDIA device plugin, and makes the pod unschedulable on a
            # node without a card, hence commented out rather than defaulted.
            # nvidia.com/gpu: 1

        probes:
          # The index page is served by the same Flask app as /stats, so it
          # answers exactly when the API does.
          liveness:
            enabled: true
            type: HTTP
            path: /
            spec:
              periodSeconds: 30
              failureThreshold: 3
          readiness:
            enabled: true
            type: HTTP
            path: /
            spec:
              periodSeconds: 10
          startup:
            enabled: true
            type: HTTP
            path: /
            spec:
              periodSeconds: 5
              failureThreshold: 12

service:
  main:
    controller: main
    ports:
      http:
        port: 5000

ingress:
  main:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: sys-stats.example.com
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls: []
    # tls:
    #   - secretName: sys-stats-tls
    #     hosts:
    #       - sys-stats.example.com
