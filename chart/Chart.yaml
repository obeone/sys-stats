---
apiVersion: v2
name: sys-stats
description: Real-time system, GPU and Ollama monitoring dashboard (terminal + web).
type: application

# Chart version, bumped on chart changes only. It is deliberately independent
# from appVersion, which tracks the sys-stats release the chart deploys.
#
# Both lines are rewritten by scripts/sync-versions.sh when a release is
# published: appVersion follows the git tag, and the chart's own patch level
# moves with it, because changing what the chart deploys is a chart change.
# Bump `version` by hand for chart-only changes; leave `appVersion` alone.
version: 0.2.0
appVersion: "1.5.0"

home: https://github.com/obeone/sys-stats
sources:
  - https://github.com/obeone/sys-stats
maintainers:
  - name: obeone
    email: obeone@obeone.org
keywords:
  - monitoring
  - dashboard
  - gpu
  - nvidia
  - ollama

dependencies:
  - name: common
    repository: https://bjw-s-labs.github.io/helm-charts
    version: 5.0.1
